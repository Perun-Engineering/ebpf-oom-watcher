image:
  repository: ghcr.io/perun-engineering/ebpf-oom-watcher
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion. Release CI pins this to the version it just built;
  # leaving it empty keeps a local `helm install` on a tag that actually exists.
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsUser: 0
  runAsGroup: 0

# privileged is not needed: it implied the capability list below rather than adding to
# it, and on kernel >= 5.8 three capabilities cover everything the probe does. CAP_BPF
# loads the program and creates the maps, CAP_PERFMON attaches it to the tracepoint
# (perf_event_open), and CAP_SYS_RESOURCE covers the ring buffer against RLIMIT_MEMLOCK
# on kernels that still charge BPF memory to it.
securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - BPF
      - PERFMON
      - SYS_RESOURCE

# Measured, not guessed: 23Mi RSS with 27 pods cached on an arm64 Bottlerocket node
# (0.4.0, 2026-08-23). The pod cache is the term that scales with node density, and one
# measurement cannot separate its slope from the fixed cost, so the 64Mi request keeps
# ~2.8x headroom over the one node actually observed rather than being cut to fit it.
#
# No CPU limit: the steady state is blocked on epoll, and the one moment CPU is needed is
# an OOM storm — throttling there would delay a `/proc/<pid>/cgroup` read that is already
# racing the reaper. The memory limit stays: OOM-killing the watcher loses events silently,
# so it is a backstop against a leak, not a fitted bound.
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

# A node-level DaemonSet belongs on every node, tainted pools included. Tolerating only
# the control-plane taints makes a tainted node report DESIRED=0 with no error at all.
tolerations:
  - operator: Exists

affinity: {}

env:
  metricsPort: 8080
  logLevel: info
  # Per-container series (oom_kills_total and friends) are keyed on pod name, so an
  # OOM-looping pod mints a new one on every restart. A series with no OOM event for
  # seriesTtlSeconds is deleted. Keep this well above serviceMonitor.interval below —
  # a series deleted before it is scraped takes its increments with it.
  seriesTtlSeconds: 1800
  seriesSweepIntervalSeconds: 300

service:
  type: ClusterIP
  port: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  labels: {}
  annotations: {}

# The watcher only talks to the API server, which Config::incluster() reaches by IP, so
# host networking buys nothing and claims port 8080 on every node. When it is enabled the
# template also sets dnsPolicy: ClusterFirstWithHostNet so cluster DNS keeps resolving.
hostNetwork: false

hostPaths:
  proc: /proc
  sys: /sys
  debugfs: /sys/kernel/debug
  cgroup: /sys/fs/cgroup

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# A node-level DaemonSet should outrank ordinary workloads for scheduling and eviction: an
# OOM watcher that gets evicted under memory pressure is useless exactly when it is needed.
#
# Before installing cluster-wide, check `allocatable.pods` on every node, not just CPU and
# memory. A node at its pod cap has no room whatever its CPU and memory look like, and at
# this priority the scheduler makes room by evicting a lower-priority pod. On EKS the cap
# comes from the instance's ENI limit and can be as low as 8:
#
#   kubectl get nodes -o custom-columns=NAME:.metadata.name,PODS:.status.allocatable.pods
#
# Set this to "" on a cluster where that trade is not wanted; the DaemonSet then stays
# Pending on a full node instead of displacing anything.
priorityClassName: system-node-critical

terminationGracePeriodSeconds: 30
