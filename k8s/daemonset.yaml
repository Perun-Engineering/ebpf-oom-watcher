apiVersion: v1
kind: ServiceAccount
metadata:
  name: oom-watcher
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oom-watcher
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oom-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oom-watcher
subjects:
- kind: ServiceAccount
  name: oom-watcher
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: oom-watcher
  namespace: kube-system
  labels:
    app: oom-watcher
spec:
  selector:
    matchLabels:
      app: oom-watcher
  template:
    metadata:
      labels:
        app: oom-watcher
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: oom-watcher
      hostPID: true
      # No hostNetwork: the API server is reached by IP, so host networking buys nothing
      # and would claim port 8080 on every node.
      priorityClassName: system-node-critical
      # A node-level DaemonSet belongs on every node, tainted pools included.
      tolerations:
      - operator: Exists
      containers:
      - name: oom-watcher
        image: ghcr.io/perun-engineering/ebpf-oom-watcher:latest
        imagePullPolicy: Always
        securityContext:
          # On kernel >= 5.8 privileged is unnecessary: CAP_BPF loads the program and
          # creates the maps, CAP_PERFMON attaches it to the tracepoint, and
          # CAP_SYS_RESOURCE covers the ring buffer against RLIMIT_MEMLOCK.
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - BPF
            - PERFMON
            - SYS_RESOURCE
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: METRICS_PORT
          value: "8080"
        - name: RUST_LOG
          value: "info"
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        # 23Mi RSS measured with 27 pods cached (0.4.0, 2026-08-23). No CPU limit —
        # throttling during an OOM storm would delay the /proc read that is already
        # racing the reaper. The memory limit is a leak backstop, not a fitted bound.
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
        volumeMounts:
        - name: proc
          mountPath: /proc
          readOnly: true
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: debugfs
          mountPath: /sys/kernel/debug
          readOnly: true
        - name: cgroup
          mountPath: /sys/fs/cgroup
          readOnly: true
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: oom-watcher-metrics
  namespace: kube-system
  labels:
    app: oom-watcher
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
  selector:
    app: oom-watcher
